services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${YAYBMT_DB_PASSWORD:?Generate .env first}
      MARIADB_ROOT_PASSWORD: ${YAYBMT_DB_ROOT_PASSWORD:?Generate .env first}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
  wordpress:
    image: wordpress:6.8.3-php8.3-apache
    ports:
      - 127.0.0.1:8085:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${YAYBMT_DB_PASSWORD:?Generate .env first}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/yaybmt:/var/www/html/wp-content/themes/yaybmt:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
  wp_data:
